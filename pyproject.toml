[project]
name = "echo"
version = "0.1.0"
description = "Modo DJ da GAIA (perfil musical, ranking determinístico, Radar Musical semanal) - processo próprio, sem interface gráfica, consumido pela GAIA via HTTP."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echo*"]

[project.scripts]
echo-dj = "echo.main:main"
